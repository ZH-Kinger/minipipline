[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-embodied-pipeline"
version = "0.2.0"
description = "Multimodal human-demonstration data pipeline (ITW ingest + hand-pose features + LeRobot v3 packing)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
]

[project.scripts]
mmpipe = "multimodal_pipeline.cli:main"
multimodal-pipeline = "multimodal_pipeline.cli:main"
